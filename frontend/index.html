<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="Lokalblick – fastigheter, avtal, ärenden och ekonomi.">
  <meta http-equiv="refresh" content="0; url=./v2/index.html">
  <title>Lokalblick</title>
  <script>
    const url = new URL("./v2/index.html",location.href);
    const params = new URLSearchParams(location.search);
    params.delete("legacy");
    url.search=params.toString();
    url.hash=location.hash;
    location.replace(url.href);
  </script>
</head>
<body><p>Öppnar Lokalblick. <a href="./v2/index.html">Fortsätt till appen</a>.</p></body>
</html>
