openapi: 3.0.3
info:
  title: Lokalblick API
  version: 0.2.0
  description: >
    Loopback-only company-local API. LEB master data is read-only;
    Lokalblick-owned data is persisted by the backend.
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Check service health
      responses:
        "200":
          description: Service status
  /source/status:
    get:
      summary: Return source status without source data
      responses:
        "200":
          description: Counts and file status only
  /source/refresh:
    post:
      summary: Reload LEB and merge with backend persistence
      responses:
        "200":
          description: Updated workspace
  /bootstrap:
    get:
      summary: Load LEB core and backend-persisted workspace
      responses:
        "200":
          description: Workspace snapshot
  /workspace:
    patch:
      summary: Persist user-owned workspace data and overlays
      responses:
        "200":
          description: Updated workspace snapshot
  /{entity}:
    get:
      summary: List permitted records
      parameters:
        - in: path
          name: entity
          required: true
          schema:
            type: string
            enum: [properties, contracts, organizations, people, assignments, projects, maintenance, maintenance-status, drift-costs, operations, drift-issues, wishes, investigations, budget-data, coordinates, contract-overlays, property-overlays]
      responses:
        "200":
          description: Records
    post:
      summary: Create a user-owned record
      parameters:
        - in: path
          name: entity
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Created
  /{entity}/{id}:
    get:
      summary: Get one permitted record
      parameters:
        - in: path
          name: entity
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Record
    patch:
      summary: Update a user-owned record
      parameters:
        - in: path
          name: entity
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
    delete:
      summary: Delete a user-owned record or persist a core-data tombstone
      parameters:
        - in: path
          name: entity
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
