openapi: 3.0.3
info:
  title: Lokalblick API
  version: 0.2.0
  description: >
    Contract between the Lokalblick frontend and the authenticated
    Microsoft 365 backend. No production secrets or data belong in GitHub.
servers:
  - url: /api
security:
  - entraBearer: []
paths:
  /health:
    get:
      summary: Health and backend capability check
      security: []
      responses:
        "200":
          description: Backend status
  /geocode:
    post:
      summary: Resolve property addresses to coordinates
      description: >
        Backend-owned coordinate enrichment. The backend must reuse a stored
        coordinate while the address is unchanged and re-geocode after an
        address change. Requests are processed in batches of at most 100.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [properties]
              properties:
                properties:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [id, address]
                    properties:
                      id: { type: string }
                      sourceId: { type: string }
                      address: { type: string }
                      latitude: { type: number, nullable: true }
                      longitude: { type: number, nullable: true }
      responses:
        "200":
          description: Geocoding results
        "400":
          description: Invalid request
        "503":
          description: Geocoding provider is not configured
  /workspace:
    patch:
      summary: Persist a frontend workspace change set
      description: >
        Transitional frontend contract. The production backend may internally
        translate this into granular SharePoint/Dataverse writes and must
        enforce authorization and concurrency.
      responses:
        "200":
          description: Updated workspace snapshot
  /bootstrap:
    get:
      summary: Load the current user's permitted Lokalblick workspace
      responses:
        "200":
          description: Bootstrap payload
  /budget/{year}:
    get:
      summary: Build annual budget from contracts and timed needs
      parameters:
        - in: path
          name: year
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Budget rows and summaries
  /leb/refresh:
    post:
      summary: Refresh LEB from the approved SharePoint workbook
      description: >
        Server-side operation. The browser never uploads the LEB workbook
        to the public frontend.
      responses:
        "202":
          description: Refresh accepted
  /{entity}:
    get:
      summary: List permitted records
      parameters:
        - in: path
          name: entity
          required: true
          schema:
            type: string
            enum: [properties, objects, people, assignments, projects, maintenance-status, maintenance, drift-costs, drift-issues, wishes, investigations]
      responses:
        "200":
          description: Records
    post:
      summary: Create a record
      parameters:
        - in: path
          name: entity
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Created
  /{entity}/{id}:
    get:
      summary: Get one permitted record
      parameters:
        - in: path
          name: entity
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Record
    patch:
      summary: Update a record
      parameters:
        - in: path
          name: entity
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
components:
  securitySchemes:
    entraBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
