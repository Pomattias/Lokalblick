openapi: 3.0.3
info:
  title: Lokalblick API
  version: 0.3.0
  description: >
    Backend/frontend contract for the new canonical Lokalblick data model.
    The current company runtime binds to loopback; a remote deployment must
    enforce authentication and authorization. No company data or secrets may
    be kept in public frontend assets.
servers:
  - url: /api
# Remote deployments require an authorization layer. The current company
# implementation uses a loopback-only boundary, not deployed Entra authentication.
security: []
paths:
  /health:
    get:
      summary: Health and backend capability check
      security: []
      responses:
        "200":
          description: Backend status
  /geocode:
    post:
      summary: Resolve property addresses to coordinates
      description: >
        Backend-owned coordinate enrichment. The backend must reuse a stored
        coordinate while the address is unchanged and re-geocode after an
        address change. Requests are processed in batches of at most 100.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [properties]
              properties:
                properties:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [id, address]
                    properties:
                      id: { type: string }
                      sourceId: { type: string }
                      address: { type: string }
                      latitude: { type: number, nullable: true }
                      longitude: { type: number, nullable: true }
      responses:
        "200":
          description: Geocoding results
        "400":
          description: Invalid request
        "503":
          description: Geocoding provider is not configured
  /workspace:
    patch:
      summary: Persist a frontend workspace change set
      description: >
        Writes current canonical records only. The company backend owns local
        storage and overlays. Any future internal/external database adapter
        must implement the same validation and authorization contract.
      responses:
        "200":
          description: Updated workspace snapshot
  /bootstrap:
    get:
      summary: Load the current user's permitted Lokalblick workspace
      responses:
        "200":
          description: Bootstrap payload
  /budget/{year}:
    get:
      summary: Read annual budget based on agreements, cases and recurring costs
      parameters:
        - in: path
          name: year
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Budget rows and summaries
  /leb/refresh:
    post:
      summary: Refresh from an approved private source file
      description: >
        Server-side operation. The browser never uploads the LEB workbook
        to the public frontend.
      responses:
        "202":
          description: Refresh accepted
  /{entity}:
    get:
      summary: List permitted records
      parameters:
        - in: path
          name: entity
          required: true
          schema:
            type: string
            enum: [properties, objects, contracts, organizations, people, activities, orders, recurring-costs, budget-data, coordinates, contract-overlays, property-overlays]
      responses:
        "200":
          description: Records
    post:
      summary: Create a record
      parameters:
        - in: path
          name: entity
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Created
  /{entity}/{id}:
    get:
      summary: Get one permitted record
      parameters:
        - in: path
          name: entity
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Record
    patch:
      summary: Update a record
      parameters:
        - in: path
          name: entity
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
components: {}

