<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lokalblick</title>
  <meta name="description" content="LEB-baserad överblick över fastigheter, avtal, projekt, underhåll, drift och arbetsfördelning." />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="app-v2.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">L</div>
        <div>
          <strong>Lokalblick</strong>
          <span>Fastighet · Objekt · Budget · Organisation</span>
        </div>
      </div>
      <nav id="main-nav" class="nav-list" aria-label="Huvudnavigation"></nav>
      <div class="sidebar-foot">
        <div class="privacy-note">LEB-filen läses lokalt i webbläsaren och laddas inte upp till GitHub.</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow" id="page-eyebrow">PORTFÖLJ</div>
          <h1 id="page-title">Översikt</h1>
        </div>
        <div class="topbar-actions">
          <label class="file-button" for="leb-file">Importera LEB Excel</label>
          <input id="leb-file" type="file" accept=".xlsx,.xls" hidden />
          <button id="clear-data" class="button secondary" type="button">Rensa lokal data</button>
        </div>
      </header>

      <section id="mode-banner" class="mode-banner demo">
        <strong>Demoläge</strong>
        <span>Importera en LEB-fil med flikarna SF och EXT för att ersätta demoobjekten.</span>
      </section>

      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="editor-dialog" class="editor-dialog">
    <form method="dialog" id="editor-form">
      <div class="dialog-head">
        <div>
          <div class="eyebrow" id="dialog-eyebrow">NY POST</div>
          <h2 id="dialog-title">Lägg till</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="Stäng">×</button>
      </div>
      <div id="dialog-fields" class="dialog-fields"></div>
      <div class="dialog-actions">
        <button class="button secondary" value="cancel" type="button" id="dialog-cancel">Avbryt</button>
        <button class="button primary" value="default" type="submit">Spara</button>
      </div>
    </form>
  </dialog>
</body>
</html>
