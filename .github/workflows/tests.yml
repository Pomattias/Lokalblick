name: Lokalblick checks

on:
  push:
    branches: [utveckling]
  pull_request:
    branches: [utveckling]

permissions:
  contents: read

jobs:
  unit-and-contract:
    name: Unit, import and API contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:editor-browser
