name: Lokalblick checks

on:
  push:
    branches: [utveckling]
  pull_request:
    branches: [utveckling]

# Avbryt äldre körningar för samma gren/PR vid täta uppdateringar.
# Den senaste commiten testas fortfarande med båda jobben nedan.
concurrency:
  group: lokalblick-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-and-contract:
    name: Unit, import and API contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:editor-browser
      - run: npm run test:mobile-record-browser
      - run: npm run test:portfolio-mobile-table-browser
      - run: npm run test:guided-import-browser

  v3-native:
    name: V3 database and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:v3
      - run: npx playwright install --with-deps chromium
      - run: npm run test:v3-browser
